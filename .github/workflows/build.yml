name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "SwipeNav-project (2)/SwipeNav"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-19" "build-tools;34.0.0" >/dev/null || true
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeNav-flash
          path: "SwipeNav-project (2)/SwipeNav/out/SwipeNav-flash.zip"
